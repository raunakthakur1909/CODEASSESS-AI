name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/codeassess-ai-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/codeassess-ai-frontend

jobs:
  quality-and-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Backend - Run Maven Tests
        run: ./mvnw clean test
        working-directory: ./backend

      - name: Frontend - Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Frontend - Run Tests
        run: npm test
        working-directory: ./frontend

      - name: Frontend - Run Lint
        run: npm run lint
        working-directory: ./frontend

      - name: Frontend - Build
        run: npm run build
        working-directory: ./frontend

  docker-and-e2e:
    name: Docker & Real-Time E2E
    runs-on: ubuntu-latest
    needs: quality-and-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Test Environment
        run: |
          cp .env.example .env
          echo "JWT_SECRET=super-secret-key-for-ci-testing-purposes-only-which-is-long" >> .env
          echo "POSTGRES_USER=codeassess" >> .env
          echo "POSTGRES_PASSWORD=change-me-local" >> .env
          echo "SPRING_DATASOURCE_USERNAME=codeassess" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=change-me-local" >> .env
          echo "SPRING_PROFILES_ACTIVE=prod" >> .env

      - name: Docker - Validate Compose Config
        run: docker compose config

      - name: Docker - Build Images
        run: docker compose build

      - name: Security - Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'codeassess-ai-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Security - Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'codeassess-ai-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Environment - Start Compose Stack
        run: docker compose up -d

      - name: Environment - Validate Backend Health & Flyway
        run: |
          echo "Waiting for backend to be healthy..."
          timeout 120 bash -c 'until docker inspect --format="{{json .State.Health.Status}}" codeassess-backend | grep -q "\"healthy\""; do sleep 5; done'
          echo "Backend is healthy! Flyway migration and schema validation succeeded."

      - name: Environment - Validate Frontend Health
        run: |
          echo "Waiting for frontend to be healthy..."
          timeout 120 bash -c 'until docker inspect --format="{{json .State.Health.Status}}" codeassess-frontend | grep -q "\"healthy\""; do sleep 5; done'
          echo "Frontend is healthy!"

      - name: Test - Run Real-Time E2E
        shell: pwsh
        run: ./docs/TEST-E2E-REALTIME.ps1

      - name: Collect Docker Logs on Failure
        if: failure()
        run: docker compose logs > docker-compose.log

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-compose.log

      - name: Cleanup - Stop Compose Stack
        if: always()
        run: docker compose down -v

  publish-images:
    name: Build & Publish to GHCR
    needs: [quality-and-security, docker-and-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  release:
    name: GitHub Release
    needs: publish-images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
  deploy:
    name: Deploy to AWS ECS
    needs: publish-images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download Backend Task Definition
        run: |
          aws ecs describe-task-definition --task-definition codeassess-backend-production --query taskDefinition > backend-task-def.json

      - name: Fill in the new Backend image ID in the Amazon ECS task definition
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: backend
          image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Amazon ECS Backend task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          service: codeassess-backend-service-production
          cluster: codeassess-cluster-production
          wait-for-service-stability: true

      - name: Download Frontend Task Definition
        run: |
          aws ecs describe-task-definition --task-definition codeassess-frontend-production --query taskDefinition > frontend-task-def.json

      - name: Fill in the new Frontend image ID in the Amazon ECS task definition
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Amazon ECS Frontend task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          service: codeassess-frontend-service-production
          cluster: codeassess-cluster-production
          wait-for-service-stability: true
