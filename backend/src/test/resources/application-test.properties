# Test profile: keep update for schema creation in tests
spring.datasource.url=jdbc:h2:mem:codeassess;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.com.codeassess.backend=WARN
logging.level.org.springframework.web=WARN
jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hmac-signing
jwt.expiration=3600000
