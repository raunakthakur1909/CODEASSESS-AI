# Production: let Flyway manage schema (ddl-auto=validate enforces this)
spring.jpa.hibernate.ddl-auto=validate

# No SQL logging in production
spring.jpa.show-sql=false

# Structured JSON logging (Logback config handles format)
logging.level.com.codeassess.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Never expose stack traces in API responses
server.error.include-stacktrace=never
server.error.include-message=never

# Longer JWT for production
jwt.expiration=86400000

# Secure Actuator in Prod
management.endpoint.health.show-details=never
