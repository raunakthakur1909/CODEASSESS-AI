# SQL logging for development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow Hibernate to create/update schema in dev (Flyway owns schema in prod)
spring.jpa.hibernate.ddl-auto=update

# Verbose logging for development
logging.level.com.codeassess.backend=DEBUG
logging.level.org.springframework.web=DEBUG

# Full error detail in dev
server.error.include-stacktrace=always

# JWT config for dev (secret comes from JWT_SECRET env var in Docker Compose)
jwt.secret=${JWT_SECRET:change-this-to-a-long-local-development-secret}
jwt.expiration=3600000

